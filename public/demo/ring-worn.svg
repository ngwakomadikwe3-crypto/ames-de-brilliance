<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#2A2D32"/>
      <stop offset="100%" stop-color="#0F1114"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="48%" r="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4340"/>
      <stop offset="100%" stop-color="#3A3633"/>
    </linearGradient>
    <linearGradient id="band3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8C6C1"/>
      <stop offset="50%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#A6A6AB"/>
    </linearGradient>
    <linearGradient id="diamond3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D0CEC9"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg3)"/>
  <circle cx="400" cy="380" r="140" fill="url(#glow3)"/>
  <!-- Hand/finger silhouette -->
  <g opacity="0.85">
    <path d="M340,650 C340,520 355,450 365,420 C370,405 375,395 380,390 L380,300 C380,290 390,285 400,285 C410,285 420,290 420,300 L420,390 C425,395 430,405 435,420 C445,450 460,520 460,650 Z" fill="url(#skin)"/>
    <!-- Adjacent fingers (subtle) -->
    <path d="M300,650 C300,540 310,480 320,450 C325,438 328,430 330,425 L330,350 C330,342 338,338 345,338 C352,338 360,342 360,350 L360,420 C362,425 365,435 368,448 C372,465 375,490 375,530" fill="url(#skin)" opacity="0.6"/>
    <path d="M440,650 C440,530 445,470 450,440 C452,430 455,422 458,418 L458,355 C458,347 465,343 472,343 C479,343 486,347 486,355 L486,415 C488,420 490,430 492,442 C496,460 500,490 500,540" fill="url(#skin)" opacity="0.5"/>
  </g>
  <!-- Ring on finger -->
  <g filter="url(#shadow3)">
    <!-- Band around finger -->
    <ellipse cx="400" cy="400" rx="28" ry="12" fill="none" stroke="url(#band3)" stroke-width="10"/>
    <ellipse cx="400" cy="400" rx="28" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Setting -->
    <line x1="388" y1="390" x2="392" y2="365" stroke="#E8E6E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="412" y1="390" x2="408" y2="365" stroke="#E8E6E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Diamond -->
    <polygon points="400,348 412,362 408,380 392,380 388,362" fill="url(#diamond3)" opacity="0.95"/>
    <polygon points="400,348 388,362 392,380 400,375 408,380 412,362" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
    <!-- Sparkle on diamond -->
    <circle cx="398" cy="356" r="2" fill="white" opacity="0.9"/>
    <line x1="398" y1="354" x2="398" y2="348" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="396" y1="356" x2="392" y2="356" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="400" y1="356" x2="404" y2="356" stroke="white" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Soft ambient light on hand -->
  <ellipse cx="400" cy="450" rx="80" ry="200" fill="rgba(255,255,255,0.02)"/>
  <text x="400" y="720" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="0.14em" fill="#6E6C69" font-weight="400">ON HAND</text>
</svg>