<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2D32"/>
      <stop offset="100%" stop-color="#14161A"/>
    </radialGradient>
    <radialGradient id="glow2" cx="45%" cy="42%" r="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="band2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0CEC9"/>
      <stop offset="30%" stop-color="#E8E6E1"/>
      <stop offset="60%" stop-color="#C8C6C1"/>
      <stop offset="100%" stop-color="#A6A6AB"/>
    </linearGradient>
    <linearGradient id="diamond2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#D8D6D1"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg2)"/>
  <ellipse cx="400" cy="430" rx="180" ry="25" fill="rgba(0,0,0,0.2)"/>
  <circle cx="380" cy="360" r="150" fill="url(#glow2)"/>
  <g filter="url(#shadow2)" transform="rotate(-15, 400, 420)">
    <!-- Ring band - angled view -->
    <ellipse cx="400" cy="480" rx="130" ry="60" fill="none" stroke="url(#band2)" stroke-width="16"/>
    <!-- Prongs at angle -->
    <line x1="365" y1="430" x2="380" y2="365" stroke="#E8E6E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="410" y1="425" x2="405" y2="370" stroke="#E8E6E1" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="375" y1="428" x2="365" y2="375" stroke="#D0CEC9" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="435" x2="420" y2="378" stroke="#D0CEC9" stroke-width="3" stroke-linecap="round"/>
    <!-- Diamond - angled view showing depth -->
    <polygon points="388,340 418,365 410,398 378,398 368,368" fill="url(#diamond2)" opacity="0.95"/>
    <polygon points="388,340 368,368 378,398 388,385 398,398 418,365" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
    <!-- Inner facet lines -->
    <line x1="388" y1="340" x2="393" y2="398" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="388" y1="340" x2="410" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="388" y1="340" x2="373" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <!-- Sparkle -->
    <circle cx="385" cy="355" r="2.5" fill="white" opacity="0.85"/>
    <circle cx="405" cy="370" r="1.5" fill="white" opacity="0.6"/>
    <line x1="385" y1="352" x2="385" y2="344" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <line x1="382" y1="355" x2="376" y2="355" stroke="white" stroke-width="0.8" opacity="0.4"/>
  </g>
  <text x="400" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="0.14em" fill="#6E6C69" font-weight="400">ANGLE</text>
</svg>