<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2D32"/>
      <stop offset="100%" stop-color="#14161A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E6E1"/>
      <stop offset="40%" stop-color="#C8C6C1"/>
      <stop offset="70%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#A6A6AB"/>
    </linearGradient>
    <linearGradient id="diamond" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F0F0F0"/>
      <stop offset="60%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#D0CEC9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="420" rx="200" ry="30" fill="rgba(0,0,0,0.25)" filter="url(#sparkle)"/>
  <circle cx="400" cy="350" r="160" fill="url(#glow)"/>
  <!-- Ring band - front view -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="480" rx="120" ry="55" fill="none" stroke="url(#band)" stroke-width="18" stroke-linecap="round"/>
    <!-- Prongs -->
    <line x1="375" y1="440" x2="390" y2="380" stroke="#E8E6E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="425" y1="440" x2="410" y2="380" stroke="#E8E6E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="385" y1="435" x2="375" y2="385" stroke="#E8E6E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="415" y1="435" x2="425" y2="385" stroke="#E8E6E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Diamond - front face -->
    <polygon points="400,340 425,370 415,400 385,400 375,370" fill="url(#diamond)" opacity="0.95"/>
    <polygon points="400,340 375,370 385,400 400,395 415,400 425,370" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- Sparkle on diamond -->
    <circle cx="395" cy="358" r="3" fill="white" opacity="0.9"/>
    <circle cx="410" cy="372" r="1.5" fill="white" opacity="0.7"/>
    <line x1="395" y1="355" x2="395" y2="345" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="392" y1="358" x2="386" y2="358" stroke="white" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Label -->
  <text x="400" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="0.14em" fill="#6E6C69" text-transform="uppercase" font-weight="400">FRONT</text>
</svg>